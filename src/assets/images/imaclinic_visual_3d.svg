<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E2433" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#07131D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030508" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="toothShading" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F1F7FB" />
      <stop offset="65%" stop-color="#9BC2D8" />
      <stop offset="100%" stop-color="#2D4658" />
    </linearGradient>
    <linearGradient id="wireframeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="radarGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#38BDF8" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#040609" />
  <rect width="1600" height="1000" fill="url(#spaceGlow)" />
  <rect width="1600" height="1000" fill="url(#radarGrid)" />

  <!-- Outer frame border -->
  <rect x="40" y="40" width="1520" height="920" rx="4" fill="none" stroke="#1E2A38" stroke-width="1.5" />

  <!-- Header bar -->
  <rect x="40" y="40" width="1520" height="70" fill="#0A0E14" />
  <line x1="40" y1="110" x2="1560" y2="110" stroke="#1E2A38" stroke-width="1.5" />

  <!-- Badges -->
  <rect x="80" y="60" width="160" height="30" rx="3" fill="#141C24" stroke="#C9A96E" stroke-opacity="0.3" stroke-width="1" />
  <text x="160" y="80" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#C9A96E" text-anchor="middle" letter-spacing="2">VISUAL 02</text>

  <rect x="255" y="60" width="220" height="30" rx="3" fill="#141C24" stroke="#223040" stroke-width="1" />
  <text x="365" y="80" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="2">3D TOOTH INTEGRATION</text>

  <text x="1480" y="80" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#64748B" text-anchor="end" letter-spacing="2">REAL-TIME WEBGL · BLENDER</text>

  <!-- Central Dramatic 3D Tooth Model Showcase -->
  <g transform="translate(800, 520)">
    <!-- Aura Rings -->
    <circle cx="0" cy="-20" r="300" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.12" stroke-dasharray="8 12" />
    <circle cx="0" cy="-20" r="230" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.18" />
    <circle cx="0" cy="-20" r="160" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.1" />

    <!-- Crosshair Target Marks -->
    <line x1="-340" y1="-20" x2="-290" y2="-20" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
    <line x1="290" y1="-20" x2="340" y2="-20" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="-320" x2="0" y2="-280" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="240" x2="0" y2="280" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />

    <!-- Tooth Sculpture -->
    <g transform="translate(-180, -260) scale(1.8)" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.85))">
      <!-- Solid Render -->
      <path
        d="M100,80 C130,50 180,45 200,70 C220,45 270,50 300,80 C340,120 350,190 330,270 C310,330 290,400 270,450 C260,470 245,465 240,430 C230,360 215,280 200,250 C185,280 170,360 160,430 C155,465 140,470 130,450 C110,400 90,330 70,270 C50,190 60,120 100,80 Z"
        fill="url(#toothShading)"
      />

      <!-- Specular Highlight -->
      <path
        d="M130,75 C160,95 240,95 270,75 C250,120 230,150 200,150 C170,150 150,120 130,75 Z"
        fill="#FFFFFF"
        opacity="0.65"
      />

      <!-- Wireframe Overlays -->
      <g fill="none" stroke="url(#wireframeGold)" stroke-width="1.3" opacity="0.75">
        <path d="M100,80 Q200,105 300,80" />
        <path d="M80,140 Q200,165 320,140" />
        <path d="M68,210 Q200,230 332,210" />
        <path d="M80,280 Q200,295 320,280" />
        <path d="M110,350 Q200,360 290,350" />
        <path d="M135,420 Q200,425 265,420" />

        <path d="M200,70 C190,160 180,260 160,430" />
        <path d="M200,70 C210,160 220,260 240,430" />
        <path d="M140,75 C120,180 110,300 130,450" />
        <path d="M260,75 C280,180 290,300 270,450" />
      </g>
    </g>
  </g>

  <!-- Left Side Telemetry -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" fill="#38BDF8" letter-spacing="4">ASSET · CUSTOM 3D MESH</text>
    <text x="0" y="45" font-family="Georgia, serif" font-size="36" font-weight="300" fill="#F8FAFC">El Diente 3D como</text>
    <text x="0" y="85" font-family="Georgia, serif" font-size="36" font-weight="300" fill="#C9A96E">Núcleo Escultórico</text>

    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="280" height="60" rx="3" fill="#0E141B" stroke="#1E2A38" stroke-width="1" />
      <text x="20" y="25" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748B">GEOMETRY</text>
      <text x="20" y="46" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" fill="#E2E8F0">Custom Polygonal Mesh</text>
    </g>

    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="280" height="60" rx="3" fill="#0E141B" stroke="#1E2A38" stroke-width="1" />
      <text x="20" y="25" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748B">TEXTURE &amp; SHADER</text>
      <text x="20" y="46" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" fill="#38BDF8">Enamel Translucency</text>
    </g>

    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="280" height="60" rx="3" fill="#0E141B" stroke="#1E2A38" stroke-width="1" />
      <text x="20" y="25" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748B">PERFORMANCE</text>
      <text x="20" y="46" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" fill="#C9A96E">60 FPS WebGL Bound</text>
    </g>
  </g>

  <!-- Right Side Annotations -->
  <g transform="translate(1220, 200)">
    <rect x="0" y="0" width="280" height="380" rx="4" fill="#0E141B" stroke="#1E2A38" stroke-width="1" />
    <g transform="translate(25, 35)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#C9A96E" letter-spacing="2">ANATOMICAL CRAFT</text>
      <line x1="0" y1="18" x2="230" y2="18" stroke="#1E2A38" stroke-width="1" />

      <text x="0" y="55" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#94A3B8" line-height="20">
        <tspan x="0" dy="0">01 · CORONA ANATÓMICA</tspan>
        <tspan x="0" dy="28">02 · FOSAS OCLUSALES</tspan>
        <tspan x="0" dy="28">03 · RAÍCES BIFURCADAS</tspan>
        <tspan x="0" dy="28">04 · TOPOLOGÍA LIMPIA</tspan>
        <tspan x="0" dy="28">05 · ILUMINACIÓN ESTUDIO</tspan>
      </text>

      <line x1="0" y1="210" x2="230" y2="210" stroke="#1E2A38" stroke-width="1" />

      <text x="0" y="245" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748B">INTERACTIVE OBJECT</text>
      <text x="0" y="270" font-family="Georgia, serif" font-size="14" fill="#E2E8F0">Protagonista continuo en cada scroll del sitio web</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(100, 800)">
    <rect x="0" y="0" width="1400" height="90" rx="4" fill="#0A0E14" stroke="#1A2430" stroke-width="1" />
    <text x="40" y="50" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#38BDF8" letter-spacing="2">01 · BLENDER MODELLING</text>
    <text x="380" y="50" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#C9A96E" letter-spacing="2">02 · MESH OPTIMISATION</text>
    <text x="760" y="50" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#94A3B8" letter-spacing="2">03 · SCROLL BINDING</text>
    <text x="1140" y="50" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#38BDF8" letter-spacing="2">04 · REALTIME WEB</text>
  </g>
</svg>
