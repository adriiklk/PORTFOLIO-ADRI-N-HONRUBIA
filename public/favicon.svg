  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.9" />
  
  <!-- Iconic AH Monogram (Adrián Honrubia) -->
  <g fill="url(#gold)">
    <!-- Letter A -->
    <path d="M 21.5,16 L 27.5,16 L 35,46 L 29.8,46 L 27.8,38 L 17.5,38 L 15.5,46 L 10.5,46 Z M 18.7,33.5 L 26.6,33.5 L 22.7,19.5 Z" />
    <!-- Letter H -->
